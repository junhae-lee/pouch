<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pouch!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #f6f6f2;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    color: #1c1c1a;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  #app {
    position: relative;
    height: 100%;
    border: 8px solid #111;
    border-radius: 24px;
    overflow: hidden;
  }

  header {
    position: absolute;
    top: max(33px, env(safe-area-inset-top));
    left: 36px;
    right: 36px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }
  header button { pointer-events: auto; }
  .blk-round {
    flex: none;
    width: 42px; height: 42px;
    border-radius: 21px;
    padding: 0;
    border: none;
    background: #111;
    display: grid;
    place-items: center;
    transition: transform 0.1s;
  }
  .blk-round:active { transform: scale(0.9); }
  .blk-round svg { display: block; }
  .back-round {
    flex: none;
    width: 42px; height: 42px;
    border-radius: 21px;
    padding: 0;
    border: none;
    background: transparent;
    color: #000;
    display: grid;
    place-items: center;
    transition: transform 0.1s;
  }
  .back-round:active { transform: scale(0.9); }
  .back-round svg { display: block; }
  .hdr-title {
    flex: 1;
    text-align: center;
    font-size: 17px;
    font-weight: 800;
    color: #000;
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 8px;
  }
  .hdr-spacer { flex: none; width: 40px; }

  .ctl44 {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 22px;
    padding: 0;
    background: #111;
    border: none;
    display: grid;
    place-items: center;
    transition: transform 0.1s;
  }
  .ctl44:active { transform: scale(0.9); }
  .ctl44 svg { display: block; }
  #mainControls {
    position: absolute;
    left: 36px;
    right: 36px;
    bottom: 112px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ===== 하단 내비 필 (홈 ↔ 내 파우치) ===== */
  #navPill {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: max(21px, env(safe-area-inset-bottom));
    z-index: 47;
    display: flex;
    gap: 13px;
    padding: 8px;
    border: 1.5px solid #000;
    border-radius: 999px;
    background: #f9f071;
    box-shadow: 2px 4px 0 #000;
  }
  .nav-tab {
    flex: none;
    width: 60px; height: 40px;
    border-radius: 30px;
    padding: 0;
    border: none;
    background: transparent;
    color: #000000;
    display: grid;
    place-items: center;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .nav-tab svg { display: block; }
  .nav-tab.active { background: #111; color: #ffffff; }
  .nav-tab:active { transform: scale(0.94); }

  /* ===== 내 파우치 (전체 페이지) ===== */
  #folderList {
    position: fixed;
    inset: 0;
    z-index: 44;
    background: #f6f6f2;
    border: 8px solid #111;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: max(24px, env(safe-area-inset-top)) 30px 110px;
    overflow: hidden;
    transform: translateX(105%);
    transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  #folderList.open { transform: translateX(0); }
  .list-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    padding-top: 12px;
  }
  .logo { color: #111; }
  .logo svg { display: block; }
  .list-btns { display: flex; gap: 10px; }
  .list-btns button {
    flex: none;
    width: 42px; height: 42px;
    padding: 0;
    border: none;
    background: none;
    transition: transform 0.1s;
  }
  .list-btns button:active { transform: scale(0.9); }
  .list-btns svg { display: block; }
  .list-btns svg[hidden] { display: none; }  /* 정렬 아이콘: 하나만 노출 */
  #folderStage {
    position: relative;
    flex: 1;
    min-height: 0;
    touch-action: none;
  }
  .folder-obj {
    position: absolute;
    top: 0; left: 0;
    will-change: transform;
    cursor: grab;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.18));
  }
  .folder-obj span {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 13px;
    color: #111;
    text-align: center;
    padding: 0 12px;
    pointer-events: none;
  }
  .folder-obj.current { filter: drop-shadow(0 0 8px rgba(249,240,113,1)) drop-shadow(0 3px 4px rgba(0,0,0,0.18)); }
  .folder-obj.pressing { animation: pulse 0.9s ease-in-out infinite; }

  /* ===== 페이지 (편집) ===== */
  .page {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 48;  /* 서랍(46)보다 위층 */
    background: #f6f6f2;
    flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    gap: 18px;
    overflow-y: auto;
  }
  .page.open { display: flex; }
  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .page-head h2 { font-size: 18px; font-weight: 800; }
  .round-btn {
    width: 44px; height: 44px;
    flex: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.05);
    color: #1c1c1a;
    border: 1px solid rgba(0,0,0,0.15);
    font-size: 19px;
    padding: 0;
  }
  .pill-btn {
    flex: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    background: rgba(0,0,0,0.05);
    color: #1c1c1a;
    border: 1px solid rgba(0,0,0,0.15);
  }
  .pill-btn.save { background: #111; color: #fff; border: none; font-weight: 800; }

  /* 파우치 목록 (서랍 안 1열) */
  #folderGrid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .folder-card {
    position: relative;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border-radius: 18px;
    background: rgba(0,0,0,0.04);
    border: 1.5px solid rgba(0,0,0,0.12);
    cursor: pointer;
  }
  .folder-card .finfo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .folder-card.current { border-color: #111; background: rgba(249,240,113,0.5); }
  .folder-card .fname { font-size: 14px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder-card .fcount { font-size: 11px; color: #8a8a85; }
  .folder-card .edit-btn {
    position: absolute;
    top: 8px; right: 8px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(0,0,0,0.15);
    color: #1c1c1a;
    font-size: 13px;
    padding: 0;
  }
  .folder-card.new-card {
    flex-direction: row;
    justify-content: center;
    min-height: 0;
    padding: 18px;
    border-style: dashed;
    color: #8a8a85;
    font-size: 15px;
    font-weight: 700;
    gap: 10px;
  }
  .folder-card.new-card .plus { font-size: 22px; color: #111; }

  /* 편집 페이지 */
  #editPreview { display: grid; place-items: center; padding: 8px 0; }
  #editName {
    width: 100%;
    padding: 15px 18px;
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,0.15);
    background: rgba(0,0,0,0.04);
    color: #1c1c1a;
    font-size: 16px;
    font-family: inherit;
    text-align: center;
    outline: none;
  }
  #editName:focus { border-color: #111; }
  .opt-label { font-size: 13px; color: #8a8a85; font-weight: 700; }
  .opts {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .opt {
    display: grid;
    place-items: center;
    aspect-ratio: 1.4;
    border-radius: 16px;
    background: rgba(0,0,0,0.04);
    border: 1.5px solid transparent;
    padding: 0;
  }
  .opt.selected { border-color: #111; background: rgba(249,240,113,0.55); }
  .opt .dot { width: 34px; height: 34px; border-radius: 50%; }
  #folderDelete {
    margin-top: auto;
    padding: 14px 0;
    border-radius: 16px;
    background: rgba(220,70,70,0.08);
    border: 1px solid rgba(200,60,60,0.45);
    color: #c94b4b;
    font-weight: 700;
  }
  #folderDelete[hidden] { display: none; }

  /* ===== 누끼 처리중 오버레이 ===== */
  #processing {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(246,246,242,0.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  #processing.open { display: flex; }
  #processing .scissors { font-size: 52px; animation: snip 0.9s ease-in-out infinite; }
  @keyframes snip {
    0%, 100% { transform: rotate(-12deg); }
    50% { transform: rotate(12deg) scale(1.1); }
  }
  #processing p { font-size: 16px; font-weight: 700; color: #111; }
  #processing small { color: #8a8a85; font-size: 12px; padding: 0 32px; }

  /* ===== 파우치 (화면 전체) ===== */
  #pouch {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .sticker {
    position: absolute;
    top: 0;
    left: 0;
    display: grid;
    place-items: center;
    will-change: transform;
    cursor: grab;
    /* 블러 없는 쨍한 화이트 다이컷 테두리 */
    filter:
      drop-shadow(2px 0 0 #fff)
      drop-shadow(-2px 0 0 #fff)
      drop-shadow(0 2px 0 #fff)
      drop-shadow(0 -2px 0 #fff)
      drop-shadow(0 3px 4px rgba(0,0,0,0.25));
  }
  .sticker.dragging { cursor: grabbing; }
  /* 카메라로 채집한 누끼 스티커 — 테두리가 피사체 윤곽선을 따라감 */
  .sticker.photo {
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }

  button {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.08s;
  }
  button:active { transform: scale(0.96); }
  /* ===== 촬영 버튼 ===== */
  #shutterMain {
    width: 75px; height: 75px;
    z-index: 10;
    background: none;
    border: none;
    padding: 0;
    flex: none;
    transition: transform 0.1s;
  }
  #shutterMain svg { display: block; }
  #shutterMain .inner { transition: fill 0.12s; }
  #shutterMain.pressed { transform: scale(0.9); }
  #shutterMain.pressed .inner { fill: #444; }
  /* ===== 카메라 화면 (라임 조준경) ===== */
  #camera {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 45;
    background: #000;
    border: 8px solid #111;
    border-radius: 24px;
    overflow: hidden;
  }
  #camera.open { display: block; }
  #camera video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .cam-logo {
    position: absolute;
    top: max(33px, env(safe-area-inset-top));
    left: 36px;
    color: #ffffff;
    pointer-events: none;
    filter: drop-shadow(0 1px 5px rgba(0,0,0,0.5));
  }
  .cam-logo svg { display: block; }
  #camera .cam-ui {
    position: absolute;
    left: 36px;
    right: 36px;
    bottom: 112px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #shutter {
    width: 75px; height: 75px;
    flex: none;
    padding: 0;
    background: none;
    border: none;
    transition: transform 0.1s;
  }
  #shutter svg { display: block; }
  #shutter .inner { transition: fill 0.12s; }
  #shutter:active { transform: scale(0.9); }
  #shutter:active .inner { fill: #444; }
  #camera .ctl44 { background: rgba(0,0,0,0.75); }
  #camera #shutter svg circle { stroke: #fff; }
  #camera #shutter .inner { fill: #fff; stroke: #fff; }
  #camera #shutter:active .inner { fill: #ccc; }
  /* ===== 프린트 배치 ===== */
  #printSheet {
    position: relative;
    width: min(78vw, 300px);
    aspect-ratio: 210 / 297;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    overflow: hidden;
    touch-action: none;
    flex: none;
  }
  .sheet-hint {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    font-size: 13px;
    color: #b5b5ae;
    pointer-events: none;
  }
  .print-item {
    position: absolute;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    cursor: grab;
    filter:
      drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff)
      drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff)
      drop-shadow(0 2px 3px rgba(0,0,0,0.2));
  }
  .print-item.sel {
    outline: 2px dashed #d9c400;
    outline-offset: 3px;
  }
  .print-tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 34px;
  }
  .tray-label { font-size: 13px; font-weight: 700; color: #8a8a85; }
  #printSelTools {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  #printSelTools[hidden] { display: none; }
  .ps-hint { flex: 1; font-size: 12px; color: #8a8a85; font-weight: 700; }
  .print-item .rs-handle {
    position: absolute;
    right: -11px; bottom: -11px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #f9f071;
    border: 2.5px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    display: none;
    touch-action: none;
    cursor: nwse-resize;
  }
  .print-item.sel .rs-handle { display: block; }
  .print-item.sel { overflow: visible; }
  #printDelete {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 15px;
    padding: 0;
    background: rgba(220,70,70,0.08);
    border: 1px solid rgba(200,60,60,0.45);
    color: #c94b4b;
  }
  .print-tools .tray-label:not(:only-child) { flex: none; }
  .print-tools.selecting .tray-label { display: none; }
  #printTray {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 6px 2px 12px;
    flex: none;
  }
  .tray-item {
    flex: none;
    width: 64px; height: 64px;
    border-radius: 14px;
    background-color: rgba(0,0,0,0.04);
    background-size: 80%;
    background-repeat: no-repeat;
    background-position: center;
    border: 1.5px solid rgba(0,0,0,0.1);
    padding: 0;
  }
  .tray-item:active { transform: scale(0.93); }

  /* ===== 채집 검수 화면 ===== */
  #review {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 55;
    background: #000;
    border: 8px solid #111;
    border-radius: 24px;
    overflow: hidden;
  }
  #review.open { display: block; }
  #reviewCanvas {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 78vw;
    max-height: 48vh;
    touch-action: none;
    filter:
      drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
      drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff);
  }
  #review.erasing #reviewCanvas { cursor: crosshair; }
  .review-ui {
    position: absolute;
    left: 0; right: 0;
    bottom: max(30px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  #reviewEraser {
    width: 56px; height: 56px;
    flex: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    font-size: 22px;
    padding: 0;
    transition: background 0.15s, color 0.15s;
  }
  #reviewEraser.on { background: #f9f071; color: #111; }
  .review-row {
    display: flex;
    align-items: center;
    gap: 56px;
  }
  #reviewRetake {
    width: 72px; height: 72px;
    flex: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    font-size: 30px;
    padding: 0;
  }
  #reviewDone {
    width: 84px; height: 84px;
    flex: none;
    border-radius: 50%;
    background: #f9f071;
    border: none;
    font-size: 34px;
    padding: 0;
    transition: transform 0.1s;
  }
  #reviewDone:active { transform: scale(0.92); }
  .review-hint {
    position: absolute;
    top: max(22px, env(safe-area-inset-top));
    left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    pointer-events: none;
  }

  /* 촬영 플래시 */
  #flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  #flash.boom { opacity: 0.85; transition: opacity 0.05s; }

  /* ===== 크기 조절 패널 ===== */
  .sticker.selected {
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  #resizePanel {
    display: none;
    position: fixed;
    left: 16px; right: 16px;
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 40;
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  }
  #resizePanel.open { display: block; }
  #resizePanel .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #resizePanel label { font-size: 14px; font-weight: 700; flex: none; }
  #sizeSlider {
    flex: 1;
    accent-color: #f9f071;
    height: 28px;
  }
  #sizeVal { flex: none; width: 48px; text-align: right; font-size: 13px; color: #111; font-weight: 700; }
  #resizePanel .row.btns { margin-top: 12px; gap: 10px; }
  #stickerDelete {
    flex: 1;
    padding: 12px 0;
    background: rgba(220,70,70,0.08);
    border: 1px solid rgba(200,60,60,0.45);
    color: #c94b4b;
    font-weight: 700;
  }
  #resizeDone {
    flex: 1.4;
    padding: 12px 0;
    background: #111;
    color: #fff;
  }

  /* ===== 가로모드 안내 오버레이 ===== */
  #rotateGuard {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99;
    background: #f6f6f2;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
  }
  #rotateGuard .phone {
    font-size: 56px;
    animation: turnUp 1.6s ease-in-out infinite;
  }
  @keyframes turnUp {
    0%, 20%  { transform: rotate(90deg); }
    60%, 100% { transform: rotate(0deg); }
  }
  #rotateGuard p {
    font-size: 16px;
    font-weight: 700;
    color: #111;
  }
  #rotateGuard small { color: #8a8a85; font-size: 13px; }
  /* 폰·태블릿 크기에서 가로로 돌리면 발동 (높이가 낮아진 상태) */
  @media (orientation: landscape) and (max-height: 500px) {
    #rotateGuard { display: flex; }
  }
</style>
</head>
<body>
<div id="review">
  <div class="review-hint">채집물을 확인하세요 · 지우개로 다듬을 수 있어요</div>
  <canvas id="reviewCanvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite, Runner } = Matter;

const pouch = document.getElementById("pouch");
const engine = Engine.create();
engine.gravity.y = 1;
engine.positionIterations = 10;  // 벽 뚫기 방지: 계산 정밀도 UP
engine.velocityIterations = 8;

// ===== 스티커 데이터 (나중엔 누끼 딴 사진이 여기 들어감!) =====
const STICKERS = [
  { emoji: "🍓", size: 72 },
  { emoji: "📷", size: 80 },
  { emoji: "🧸", size: 88 },
  { emoji: "💿", size: 76 },
  { emoji: "🌷", size: 72 },
  { emoji: "🥐", size: 80 },
  { emoji: "⭐️", size: 64 },
  { emoji: "🎧", size: 76 },
];

const bodies = [];   // { body, el, size }
let walls = [];

function pouchSize() {
  return { w: pouch.clientWidth, h: pouch.clientHeight };
}

// ===== 벽 만들기 (파우치 안쪽 경계) =====
function buildWalls() {
  walls.forEach(w => Composite.remove(engine.world, w));
  const { w, h } = pouchSize();
  const t = 120; // 두꺼운 벽 (터널링 방지)
  walls = [
    Bodies.rectangle(w / 2, -t / 2 + 4, w * 2, t, { isStatic: true }),      // 위
    Bodies.rectangle(w / 2, h + t / 2 - 4, w * 2, t, { isStatic: true }),  // 아래
    Bodies.rectangle(-t / 2 + 4, h / 2, t, h * 2, { isStatic: true }),      // 왼쪽
    Bodies.rectangle(w + t / 2 - 4, h / 2, t, h * 2, { isStatic: true }),  // 오른쪽
  ];
  Composite.add(engine.world, walls);
}

// ===== 스티커 생성 =====
function makeBody(x, y, size) {
  const body = Bodies.circle(x, y, size / 2, {
    restitution: 0.55,
    friction: 0.05,
    frictionAir: 0.015,
    density: 0.0015,
  });
  Body.setAngle(body, (Math.random() - 0.5) * 0.8);
  Composite.add(engine.world, body);
  return body;
}

function spawnStickers() {
  const { w } = pouchSize();
  STICKERS.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "sticker";
    el.textContent = s.emoji;
    el.style.fontSize = s.size * 0.82 + "px";
    el.style.width = s.size + "px";
    el.style.height = s.size + "px";
    pouch.appendChild(el);
    const x = 40 + Math.random() * (w - 80);
    const y = 40 + (i % 4) * 60 + Math.random() * 30;
    bodies.push({
      body: makeBody(x, y, s.size), el, size: s.size,
      baseSize: s.size, scale: 1, storeIdx: null,
    });
  });
}

// 카메라·앨범으로 채집한 스티커 (누끼 PNG, 원본 비율 유지)
function spawnPhotoSticker(item, dropFromTop, storeIdx) {
  const { w } = pouchSize();
  const MAX = 110;
  const k = MAX / Math.max(item.w, item.h);
  const bw = Math.round(item.w * k), bh = Math.round(item.h * k);
  const scale = item.scale || 1;
  const ew = Math.round(bw * scale), eh = Math.round(bh * scale);
  const size = Math.max(ew, eh);
  const el = document.createElement("div");
  el.className = "sticker photo";
  el.style.width = ew + "px";
  el.style.height = eh + "px";
  el.style.backgroundImage = `url(${item.url})`;
  pouch.appendChild(el);
  const x = 60 + Math.random() * (w - 120);
  const y = dropFromTop ? 60 : 120 + Math.random() * 100;
  bodies.push({
    body: makeBody(x, y, size), el, size, ew, eh,
    baseSize: Math.max(bw, bh), baseEw: bw, baseEh: bh, scale,
    storeIdx: storeIdx ?? null,
  });
  if (mode === "grid") enterGrid();  // 정렬 모드 중이면 새 스티커도 줄맞춤
}

// ===== 파우치(폴더) 저장소 v3 =====
const DB_KEY = "pouch_db_v3";
const STORE_KEY = DB_KEY;  // (구버전 호환용 별칭)

function loadDB() {
  try {
    const d = JSON.parse(localStorage.getItem(DB_KEY));
    if (d && d.folders && d.folders.length) return d;
  } catch {}
  // 첫 실행: 구버전(v2) 채집품이 있으면 기본 파우치로 이사
  let old = [];
  try { old = JSON.parse(localStorage.getItem("pouch_stickers_v2")) || []; } catch {}
  const d = {
    folders: [{ id: "f" + Date.now(), name: "기본 파우치", shape: "square", color: "#00ff7d", stickers: old }],
    current: null,
  };
  d.current = d.folders[0].id;
  return d;
}

let db = loadDB();

function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch { alert("보관함이 가득 찼어요! (저장 공간 부족)"); }
}

function currentFolder() {
  return db.folders.find(f => f.id === db.current) || db.folders[0];
}

function loadCollection() { return currentFolder().stickers; }
function saveToCollection(item) {
  currentFolder().stickers.push(item);
  saveDB();
}

// ===== 탈출 감지 & 구조대 =====
const MAX_SPEED = 28;
function rescue() {
  const { w, h } = pouchSize();
  for (const { body, size } of bodies) {
    const r = size / 2;
    const { x, y } = body.position;
    // 파우치 밖으로 나갔으면 안쪽으로 즉시 복귀
    if (x < -r || x > w + r || y < -r || y > h + r) {
      Body.setPosition(body, {
        x: Math.min(Math.max(x, r + 4), w - r - 4),
        y: Math.min(Math.max(y, r + 4), h - r - 4),
      });
      Body.setVelocity(body, { x: 0, y: 0 });
    }
    // 과속 방지 (터널링의 주범)
    const v = body.velocity;
    const speed = Math.hypot(v.x, v.y);
    if (speed > MAX_SPEED) {
      const k = MAX_SPEED / speed;
      Body.setVelocity(body, { x: v.x * k, y: v.y * k });
    }
  }
}

// ===== 정렬 모드 (자유 ↔ 격자) =====
let mode = "free";
const gridTargets = new Map();
function enterGrid() {
  const { w } = pouchSize();
  const cell = 112, gap = 10, margin = 22;
  const cols = Math.max(1, Math.floor((w - margin * 2 + gap) / (cell + gap)));
  gridTargets.clear();
  bodies.forEach((item, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    gridTargets.set(item.body.id, {
      x: margin + col * (cell + gap) + cell / 2,
      y: margin + 24 + row * (cell + gap) + cell / 2,
    });
    Body.setStatic(item.body, true);
  });
}

function exitGrid() {
  gridTargets.clear();
  for (const { body } of bodies) Body.setStatic(body, false);
}

// ===== 화면 동기화 =====
function render() {
  if (mode === "grid") {
    // 격자 목표 지점으로 스르륵 이동
    for (const { body } of bodies) {
      const t = gridTargets.get(body.id);
      if (!t) continue;
      const p = body.position;
      Body.setPosition(body, { x: p.x + (t.x - p.x) * 0.16, y: p.y + (t.y - p.y) * 0.16 });
      Body.setAngle(body, body.angle * 0.84);  // 각도도 반듯하게
    }
  } else {
    rescue();
  }
  for (const { body, el, size, ew, eh } of bodies) {
    const x = body.position.x - (ew || size) / 2;
    const y = body.position.y - (eh || size) / 2;
    el.style.transform = `translate(${x}px, ${y}px) rotate(${body.angle}rad)`;
  }
  // 내 파우치 스테이지 동기화
  if (typeof fBodies !== "undefined" && folderListEl.classList.contains("open")) {
    if (fMode === "grid") {
      for (const { body } of fBodies) {
        const t = fGridTargets.get(body.id);
        if (!t) continue;
        const p = body.position;
        Body.setPosition(body, { x: p.x + (t.x - p.x) * 0.16, y: p.y + (t.y - p.y) * 0.16 });
        Body.setAngle(body, body.angle * 0.84);
      }
    } else {
      fRescue();
    }
    for (const { body, el, size } of fBodies) {
      el.style.transform = `translate(${body.position.x - size / 2}px, ${body.position.y - size / 2}px) rotate(${body.angle}rad)`;
    }
  }
  requestAnimationFrame(render);
}

// ===== 드래그 & 던지기 & 길게 누르기 =====
let drag = null; // { item, lastX, lastY, lastT }
let press = null; // 길게 누르기 감시 { item, x0, y0, timer }
const LONG_PRESS_MS = 550;

pouch.addEventListener("pointerdown", (e) => {
  if (mode === "grid") return;  // 정렬 모드에선 드래그 잠금
  if (resizeTarget) return;      // 크기조절 중엔 잠금
  const rect = pouch.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  // 가장 가까운 스티커 찾기
  let best = null, bestD = 1e9;
  for (const item of bodies) {
    const dx = item.body.position.x - px;
    const dy = item.body.position.y - py;
    const d = Math.hypot(dx, dy);
    if (d < item.size * 0.7 && d < bestD) { best = item; bestD = d; }
  }
  if (best) {
    drag = { item: best, lastX: px, lastY: py, lastT: performance.now() };
    best.el.classList.add("dragging");
    Body.setStatic(best.body, true);
    pouch.setPointerCapture(e.pointerId);
    // 길게 누르기 타이머: 거의 안 움직이고 0.55초 지나면 크기조절 모드
    press = {
      item: best, x0: px, y0: py,
      timer: setTimeout(() => {
        if (drag && drag.item === best) {
          drag.item.el.classList.remove("dragging");
          drag = null;
          openResize(best);
        }
      }, LONG_PRESS_MS),
    };
  }
});

pouch.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const rect = pouch.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  // 8px 이상 움직이면 길게 누르기 취소 (드래그 확정)
  if (press && Math.hypot(px - press.x0, py - press.y0) > 8) {
    clearTimeout(press.timer);
    press = null;
  }
  Body.setPosition(drag.item.body, { x: px, y: py });
  const now = performance.now();
  const dt = Math.max(now - drag.lastT, 1);
  drag.vx = (px - drag.lastX) / dt * 16;
  drag.vy = (py - drag.lastY) / dt * 16;
  drag.lastX = px; drag.lastY = py; drag.lastT = now;
});

function endDrag() {
  if (press) { clearTimeout(press.timer); press = null; }
  if (!drag) return;
  const { item, vx = 0, vy = 0 } = drag;
  item.el.classList.remove("dragging");
  Body.setStatic(item.body, false);
  Body.setVelocity(item.body, {
    x: Math.max(-25, Math.min(25, vx)),
    y: Math.max(-25, Math.min(25, vy)),
  });
  drag = null;
}
pouch.addEventListener("pointerup", endDrag);
pouch.addEventListener("pointercancel", endDrag);

let resizeTarget = null;

function openResize(item) {
  resizeTarget = item;
  Body.setStatic(item.body, true);  // 조절하는 동안 공중 정지
  item.el.classList.add("selected");
  sizeSlider.value = Math.round(item.scale * 100);
  sizeVal.textContent = sizeSlider.value + "%";
  resizePanel.classList.add("open");
  if (navigator.vibrate) navigator.vibrate(30);  // 촉각 피드백 (안드로이드)
}

function applyScale(item, s) {
  item.scale = s;
  const newEw = Math.round((item.baseEw || item.baseSize) * s);
  const newEh = Math.round((item.baseEh || item.baseSize) * s);
  const newSize = Math.max(newEw, newEh);
  // 몸체를 새로 만들어 교체 (정지 상태에서 scale하면 질량이 ∞로 굳는 버그 회피)
  const pos = { x: item.body.position.x, y: item.body.position.y };
  const angle = item.body.angle;
  Composite.remove(engine.world, item.body);
  item.body = makeBody(pos.x, pos.y, newSize);
  Body.setAngle(item.body, angle);
  Body.setStatic(item.body, true);  // 조절 중엔 계속 공중 정지
  item.size = newSize;
  if (item.ew !== undefined) { item.ew = newEw; item.eh = newEh; }
  item.el.style.width = newEw + "px";
  item.el.style.height = newEh + "px";
  if (!item.el.classList.contains("photo")) {
    item.el.style.fontSize = item.baseSize * s * 0.82 + "px";
  }
  // 채집품이면 현재 파우치에 크기 저장
  if (item.storeIdx !== null) {
    const list = currentFolder().stickers;
    if (list[item.storeIdx]) {
      list[item.storeIdx].scale = s;
      saveDB();
    }
  }
}

sizeSlider.addEventListener("input", () => {
  if (!resizeTarget) return;
  sizeVal.textContent = sizeSlider.value + "%";
  applyScale(resizeTarget, sizeSlider.value / 100);
});

  if (item.storeIdx !== null) {

// ===== 센서 자동 활성 (자유정렬 기본값) =====
// 첫 터치 때 권한을 받고, 자유 모드에서만 반응. 격자 정렬 중엔 자동 무시.
function handleOrientation(e) {
  if (mode !== "free") return;
  if (e.gamma == null || e.beta == null) return;
  const gx = Math.max(-1, Math.min(1, e.gamma / 40));
  const gy = Math.max(-1, Math.min(1, e.beta / 40));
  engine.gravity.x = gx;
  engine.gravity.y = gy;
  if (typeof fEngine !== "undefined" && fMode === "free") {
    fEngine.gravity.x = gx;
    fEngine.gravity.y = gy;
  }
}

// 폰을 흔들면 스티커 대폭발 (버튼 없이!)
let lastShake = 0;
function handleMotion(e) {
  if (mode !== "free") return;
  const a = e.acceleration;
  if (!a) return;
  const mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
  if (mag > 20 && performance.now() - lastShake > 900) {
    lastShake = performance.now();
    if (folderListEl.classList.contains("open")) {
      if (fMode === "free") fShakeBurst();
    } else {
      shakeBurst();
    }
  }
}

function shakeBurst() {
  for (const { body } of bodies) {
    Body.setVelocity(body, {
      x: (Math.random() - 0.5) * 30,
      y: -Math.random() * 22 - 6,
    });
    Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.6);
  }
}

let sensorsInit = false;
async function enableSensors() {
  if (sensorsInit) return;
  sensorsInit = true;
  try {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch {}
  try {
    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
      await DeviceMotionEvent.requestPermission();
    }
  } catch {}
  window.addEventListener("deviceorientation", handleOrientation);
  window.addEventListener("devicemotion", handleMotion);
}

async function openStream(mode) {
  const s = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: mode },
    audio: false,
  });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s;
  videoEl.srcObject = s;
  videoEl.style.transform = mode === "user" ? "scaleX(-1)" : "";  // 전면은 거울모드
  try { await videoEl.play(); } catch {}
}

async function openCamera(mode) {

    facing = mode;
    cameraEl.classList.add("open");
    // 내비 필: 카메라 탭 활성

      alert("카메라 권한이 꺼져있어요. 설정 > Safari > 카메라에서 허용해주세요!");
    } else if (name === "NotFoundError") {
      alert("사용 가능한 카메라를 찾지 못했어요 🥲");
    } else if (name === "NotReadableError") {
      alert("다른 앱이 카메라를 쓰고 있어요. 잠시 후 다시 시도해주세요!");
    } else if (!window.isSecureContext) {

    } else {
      alert("카메라를 열 수 없어요 (" + name + ").\n카톡·인스타 안에서 열었다면 Safari로 다시 열어주세요!");
    }
  }
}

const processingEl = document.getElementById("processing");
const procStatus = document.getElementById("procStatus");
let removeBackgroundFn = null;

// 경량(quint8) 모델 = 몇 배 빠름, 품질 차이 미미 + 다운로드 진행률 표시
const NUKKI_CONFIG = {
  model: "isnet_quint8",
  progress: (key, cur, tot) => {
    if (tot && processingEl.classList.contains("open")) {
      procStatus.textContent = `AI 모델 내려받는 중 ${Math.round(cur / tot * 100)}%`;
    }
  },
};

async function getNukkiEngine() {
  if (!removeBackgroundFn) {
    const mod = await import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm");
    removeBackgroundFn = mod.removeBackground;
  }
  return removeBackgroundFn;
}

// 🔥 워밍업: 앱 켜지면 뒤에서 미리 모델 준비 (첫 채집 대폭 단축)
let nukkiWarm = false;
setTimeout(async () => {
  try {
    const rb = await getNukkiEngine();
    const c = document.createElement("canvas");
    c.width = 8; c.height = 8;
    const bl = await new Promise(r => c.toBlob(r, "image/png"));
    await rb(bl, NUKKI_CONFIG);   // 8px 더미로 에셋 전부 로드
    nukkiWarm = true;
  } catch {}
}, 1500);

// 투명 여백을 잘라내고 알맞은 크기로 축소
function trimAndShrink(img) {
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 20) {  // 알파값 있는 픽셀
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX <= minX || maxY <= minY) return null;  // 전부 투명 = 누끼 실패
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const k = Math.min(1, 220 / Math.max(bw, bh));
  const out = document.createElement("canvas");
  out.width = Math.round(bw * k); out.height = Math.round(bh * k);
  out.getContext("2d").drawImage(c, minX, minY, bw, bh, 0, 0, out.width, out.height);
  return { url: out.toDataURL("image/png"), w: out.width, h: out.height };
}

// 촬영/앨범 공용 파이프라인: 캔버스 → AI 누끼 → 보관 → 파우치 투하
async function processAndCollect(cap) {
  processingEl.classList.add("open");
  let item = null;
  try {
    const removeBackground = await getNukkiEngine();
    procStatus.textContent = nukkiWarm
      ? "잠깐이면 돼요!"
      : "첫 채집은 AI 모델을 내려받느라 시간이 걸릴 수 있어요 (한 번만!)";
    const blob = await new Promise(r => cap.toBlob(r, "image/png"));
    const cutBlob = await removeBackground(blob, NUKKI_CONFIG);
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res; img.onerror = rej;
      img.src = URL.createObjectURL(cutBlob);
    });
    item = trimAndShrink(img);
  } catch (err) {
    item = null;  // 누끼 실패 → 폴백
  }
  if (!item) {
    // 폴백: 누끼 없이 원본으로 채집
    const k = Math.min(1, 200 / Math.max(cap.width, cap.height));
    const fb = document.createElement("canvas");
    fb.width = Math.round(cap.width * k); fb.height = Math.round(cap.height * k);
    fb.getContext("2d").drawImage(cap, 0, 0, fb.width, fb.height);
    item = { url: fb.toDataURL("image/jpeg", 0.82), w: fb.width, h: fb.height };
    alert("누끼에 실패해서 원본으로 채집했어요 🥲 (네트워크를 확인해보세요)");
  }
  processingEl.classList.remove("open");
  openReview(item);   // 저장 전에 검수 화면으로!
}

// 지우개: 캔버스 문지르기
let erasing = false;
function eraseAt(e) {
  const rect = rCanvas.getBoundingClientRect();
  const kx = rCanvas.width / rect.width;
  const ky = rCanvas.height / rect.height;
  const x = (e.clientX - rect.left) * kx;
  const y = (e.clientY - rect.top) * ky;
  const r = 16 * kx;  // 화면상 약 16px 브러시
  rCtx.globalCompositeOperation = "destination-out";
  rCtx.beginPath();
  rCtx.arc(x, y, r, 0, Math.PI * 2);
  rCtx.fill();
  rCtx.globalCompositeOperation = "source-over";
}
rCanvas.addEventListener("pointerdown", (e) => {
  if (!eraserOn) return;
  erasing = true;
  rCanvas.setPointerCapture(e.pointerId);
  eraseAt(e);
});
rCanvas.addEventListener("pointermove", (e) => { if (erasing) eraseAt(e); });
rCanvas.addEventListener("pointerup", () => { erasing = false; });
rCanvas.addEventListener("pointercancel", () => { erasing = false; });

    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res; img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
    // 비율 유지, 최대 640px로 축소해서 파이프라인 투입
    const k = Math.min(1, 640 / Math.max(img.width, img.height));
    const cap = document.createElement("canvas");
    cap.width = Math.round(img.width * k);
    cap.height = Math.round(img.height * k);
    cap.getContext("2d").drawImage(img, 0, 0, cap.width, cap.height);
    closeCamera();
    processAndCollect(cap);
  } catch {
    alert("이미지를 읽을 수 없어요. 다른 사진으로 시도해보세요!");
  }
});

// ===== 파우치 모양/색 (Catch 스타일) =====
const SHAPE_LIST = ["circle", "square", "triangle", "star", "hex", "heart"];
const COLOR_LIST = ["#00ff7d", "#c9b6f8", "#f2d478", "#ff8a8a", "#9cd2fb", "#a8e6cf", "#f9c4e1", "#fbc98c"];

function shapeSVG(shape, color, size) {
  const paths = {
    triangle: "M50 10 L92 85 L8 85 Z",
    star: "M50 6 L61 38 L95 38 L67 58 L78 92 L50 71 L22 92 L33 58 L5 38 L39 38 Z",
    hex: "M28 12 L72 12 L94 50 L72 88 L28 88 L6 50 Z",
    heart: "M50 88 C20 64 6 46 6 30 C6 16 17 8 29 8 C38 8 46 13 50 21 C54 13 62 8 71 8 C83 8 94 16 94 30 C94 46 80 64 50 88 Z",
  };
  let inner;
  if (shape === "circle") inner = `<circle cx="50" cy="50" r="42" fill="${color}" stroke="#fff" stroke-width="6"/>`;
  else if (shape === "square") inner = `<rect x="10" y="10" width="80" height="80" rx="18" fill="${color}" stroke="#fff" stroke-width="6"/>`;
  else inner = `<path d="${paths[shape]}" fill="${color}" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${inner}</svg>`;
}

// ===== 파우치 전환 =====
const folderNameEl = document.getElementById("folderName");

function clearPhotoStickers() {
  for (let i = bodies.length - 1; i >= 0; i--) {
    const it = bodies[i];
    if (it.storeIdx !== null) {
      Composite.remove(engine.world, it.body);
      it.el.remove();
      bodies.splice(i, 1);
    }
  }
}

function switchFolder(id) {
  db.current = id;
  saveDB();
  clearPhotoStickers();
  currentFolder().stickers.forEach((item, i) => spawnPhotoSticker(item, false, i));
  folderNameEl.textContent = currentFolder().name;
  if (mode === "grid") enterGrid();
}

// ===== 내 파우치 페이지 (자유/격자 도형 스테이지) =====
const folderListEl = document.getElementById("folderList");
const folderStage = document.getElementById("folderStage");
const navCamBtn = document.getElementById("navCamBtn");
const navBagBtn = document.getElementById("listBtn");

// 폴더 전용 물리 엔진
const fEngine = Engine.create();
fEngine.gravity.y = 1;
fEngine.positionIterations = 10;
fEngine.velocityIterations = 8;
Runner.run(Runner.create(), fEngine);

let fMode = db.folderView || "free";   // "free" | "grid"
let fBodies = [];   // { body, el, size, folderId }
let fWalls = [];
const fGridTargets = new Map();

function fStageSize() {
  return { w: folderStage.clientWidth, h: folderStage.clientHeight };
}

function buildFWalls() {
  fWalls.forEach(w => Composite.remove(fEngine.world, w));
  const { w, h } = fStageSize();
  const t = 120;
  fWalls = [
    Bodies.rectangle(w / 2, -t / 2 + 4, w * 2, t, { isStatic: true }),
    Bodies.rectangle(w / 2, h + t / 2 - 4, w * 2, t, { isStatic: true }),
    Bodies.rectangle(-t / 2 + 4, h / 2, t, h * 2, { isStatic: true }),
    Bodies.rectangle(w + t / 2 - 4, h / 2, t, h * 2, { isStatic: true }),
  ];
  Composite.add(fEngine.world, fWalls);
}

function clearFolderObjects() {
  for (const { body, el } of fBodies) {
    Composite.remove(fEngine.world, body);
    el.remove();
  }
  fBodies = [];
}

function buildFolderObjects() {
  clearFolderObjects();
  buildFWalls();
  const { w, h } = fStageSize();
  const SIZE = 108;
  db.folders.forEach((f, i) => {
    const el = document.createElement("div");
    el.className = "folder-obj" + (f.id === db.current ? " current" : "");
    el.style.width = SIZE + "px";
    el.style.height = SIZE + "px";
    el.innerHTML = shapeSVG(f.shape, f.color, SIZE) + `<span>${f.name}</span>`;
    folderStage.appendChild(el);
    const x = 70 + Math.random() * Math.max(1, w - 140);
    const y = fMode === "free" ? (h - 90 - Math.random() * 120) : 80;
    const body = Bodies.circle(x, y, SIZE / 2 - 4, {
      restitution: 0.5, friction: 0.06, frictionAir: 0.02, density: 0.0015,
    });
    Body.setAngle(body, (Math.random() - 0.5) * 0.5);
    Composite.add(fEngine.world, body);
    fBodies.push({ body, el, size: SIZE, folderId: f.id });
  });
  if (fMode === "grid") enterFGrid();
  updateViewBtn();
}

function enterFGrid() {
  const { w } = fStageSize();
  const cell = 112, gap = 8;
  const cols = Math.max(1, Math.floor((w + gap) / (cell + gap)));
  const x0 = (w - (cols * cell + (cols - 1) * gap)) / 2;
  fGridTargets.clear();
  fBodies.forEach((item, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    fGridTargets.set(item.body.id, {
      x: x0 + col * (cell + gap) + cell / 2,
      y: 70 + row * (cell + gap + 14) + cell / 2,
    });
    Body.setStatic(item.body, true);
  });
}
function exitFGrid() {
  fGridTargets.clear();
  for (const { body } of fBodies) Body.setStatic(body, false);
}

function updateViewBtn() {
  // 버튼엔 "다음에 전환될 모드" 아이콘 하나만 표시 (SVG는 attribute로 제어)
  folderViewBtn.querySelector(".ic-grid").toggleAttribute("hidden", fMode === "grid");
  folderViewBtn.querySelector(".ic-free").toggleAttribute("hidden", fMode === "free");
}

folderViewBtn.addEventListener("click", () => {
  fMode = fMode === "free" ? "grid" : "free";
  db.folderView = fMode;
  saveDB();
  if (fMode === "grid") { fEngine.gravity.x = 0; fEngine.gravity.y = 1; enterFGrid(); }
  else exitFGrid();
  updateViewBtn();
});

function fRescue() {
  const { w, h } = fStageSize();
  for (const { body, size } of fBodies) {
    const r = size / 2;
    const { x, y } = body.position;
    if (x < -r || x > w + r || y < -r || y > h + r) {
      Body.setPosition(body, {
        x: Math.min(Math.max(x, r + 4), w - r - 4),
        y: Math.min(Math.max(y, r + 4), h - r - 4),
      });
      Body.setVelocity(body, { x: 0, y: 0 });
    }
    const v = body.velocity;
    const sp = Math.hypot(v.x, v.y);
    if (sp > MAX_SPEED) {
      const k = MAX_SPEED / sp;
      Body.setVelocity(body, { x: v.x * k, y: v.y * k });
    }
  }
}

function fShakeBurst() {
  for (const { body } of fBodies) {
    Body.setVelocity(body, { x: (Math.random() - 0.5) * 28, y: -Math.random() * 20 - 5 });
    Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.5);
  }
}

// 스테이지 터치: 짧게 탭=선택, 드래그=던지기(자유), 길게=편집
let fDrag = null, fPress = null;
folderStage.addEventListener("pointerdown", (e) => {
  const rect = folderStage.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  let best = null, bestD = 1e9;
  for (const item of fBodies) {
    const d = Math.hypot(item.body.position.x - px, item.body.position.y - py);
    if (d < item.size * 0.65 && d < bestD) { best = item; bestD = d; }
  }
  if (!best) return;
  fDrag = { item: best, lastX: px, lastY: py, lastT: performance.now(), moved: false, wasStatic: best.body.isStatic };
  if (fMode === "free") Body.setStatic(best.body, true);
  folderStage.setPointerCapture(e.pointerId);
  best.el.classList.add("pressing");
  fPress = setTimeout(() => {
    if (fDrag && !fDrag.moved) {
      const id = fDrag.item.folderId;
      fDrag.item.el.classList.remove("pressing");
      if (fMode === "free" && !fDrag.wasStatic) Body.setStatic(fDrag.item.body, false);
      fDrag = null;
      if (navigator.vibrate) navigator.vibrate(30);
      openFolderEdit(id);   // 길게 누르면 편집
    }
  }, 550);
});
folderStage.addEventListener("pointermove", (e) => {
  if (!fDrag) return;
  const rect = folderStage.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  if (!fDrag.moved && Math.hypot(px - fDrag.lastX, py - fDrag.lastY) > 8) {
    fDrag.moved = true;
    clearTimeout(fPress);
    fDrag.item.el.classList.remove("pressing");
  }
  if (fDrag.moved && fMode === "free") {
    Body.setPosition(fDrag.item.body, { x: px, y: py });
    const now = performance.now();
    const dt = Math.max(now - fDrag.lastT, 1);
    fDrag.vx = (px - fDrag.lastX) / dt * 16;
    fDrag.vy = (py - fDrag.lastY) / dt * 16;
    fDrag.lastX = px; fDrag.lastY = py; fDrag.lastT = now;
  }
});
function fEndDrag() {
  clearTimeout(fPress);
  if (!fDrag) return;
  const { item, moved, vx = 0, vy = 0, wasStatic } = fDrag;
  item.el.classList.remove("pressing");
  if (fMode === "free") {
    Body.setStatic(item.body, false);
    if (moved) Body.setVelocity(item.body, {
      x: Math.max(-25, Math.min(25, vx)), y: Math.max(-25, Math.min(25, vy)),
    });
  } else if (wasStatic) {
    Body.setStatic(item.body, true);
  }
  const tapped = !moved;
  const fid = item.folderId;
  fDrag = null;
  if (tapped) {          // 짧은 탭 = 파우치 선택 후 홈으로
    switchFolder(fid);
    closeDrawer();
  }
}
folderStage.addEventListener("pointerup", fEndDrag);
folderStage.addEventListener("pointercancel", fEndDrag);

function closeDrawer_silent() {          // 카메라 탭이 필 상태를 직접 관리할 때

}

// ===== 프린트 배치 & 신청 =====
const printPage = document.getElementById("printPage");
const printSheet = document.getElementById("printSheet");
const printTray = document.getElementById("printTray");
const printDeleteBtn = document.getElementById("printDelete");
let printSel = null;   // 선택된 배치 인덱스

function folderLayout() {
  const f = currentFolder();
  if (!f.printLayout) f.printLayout = [];
  // 삭제된 스티커를 가리키는 배치는 정리
  f.printLayout = f.printLayout.filter(p => f.stickers[p.idx]);
  return f.printLayout;
}

// 시트 위 스티커 표시 크기 (파우치에서 보이는 크기 비율 그대로)
function placeSize(st, p) {
  const k = 110 / Math.max(st.w, st.h) * (st.scale || 1) * ((p && p.s) || 1);
  const ratio = printSheet.clientWidth / 390;
  return { w: st.w * k * ratio, h: st.h * k * ratio };
}

// 파우치의 모든 오브젝을 시트에 자동 입장 (사용자가 뺀 건 제외)
function ensureAllPlaced() {
  const f = currentFolder();
  const layout = folderLayout();
  f.printSkip = f.printSkip || {};
  const placed = new Set(layout.map(p => p.idx));
  f.stickers.forEach((st, i) => {
    if (!placed.has(i) && !f.printSkip[i]) {
      const n = layout.length;
      layout.push({
        idx: i, s: 1,
        x: 0.2 + (n % 3) * 0.3,
        y: 0.15 + (Math.floor(n / 3) % 5) * 0.19,
      });
    }
  });
  saveDB();
}

function buildTray() {
  printTray.innerHTML = "";
  currentFolder().stickers.forEach((st, i) => {
    const b = document.createElement("button");
    b.className = "tray-item";
    b.style.backgroundImage = `url(${st.url})`;
    b.addEventListener("click", () => {
      const f = currentFolder();
      if (f.printSkip) delete f.printSkip[i];
      const n = folderLayout().length;
      folderLayout().push({ idx: i, s: 1, x: 0.28 + (n % 3) * 0.22, y: 0.22 + Math.floor(n / 3) % 4 * 0.2 });
      saveDB();
      renderPlacements();
    });
    printTray.appendChild(b);
  });
}

const printSelTools = document.getElementById("printSelTools");

function selectPlacement(i) {
  printSel = i;
  printSelTools.hidden = (i === null);
  document.querySelector(".print-tools").classList.toggle("selecting", i !== null);
  [...printSheet.querySelectorAll(".print-item")].forEach((el, j) =>
    el.classList.toggle("sel", j === i));
}

function renderPlacements() {
  [...printSheet.querySelectorAll(".print-item")].forEach(el => el.remove());
  const layout = folderLayout();
  printSheet.querySelector(".sheet-hint").style.display = layout.length ? "none" : "grid";
  const W = printSheet.clientWidth, H = printSheet.clientHeight;
  layout.forEach((p, i) => {
    const st = currentFolder().stickers[p.idx];
    const s = placeSize(st, p);
    const el = document.createElement("div");
    el.className = "print-item";
    el.style.width = s.w + "px";
    el.style.height = s.h + "px";
    el.style.left = (p.x * W - s.w / 2) + "px";
    el.style.top = (p.y * H - s.h / 2) + "px";
    el.style.backgroundImage = `url(${st.url})`;
    // 크기 적용 (중심 고정)
    const applySize = () => {
      const sz = placeSize(st, p);
      const r = printSheet.getBoundingClientRect();
      el.style.width = sz.w + "px";
      el.style.height = sz.h + "px";
      el.style.left = (p.x * r.width - sz.w / 2) + "px";
      el.style.top = (p.y * r.height - sz.h / 2) + "px";
    };

    // 드래그 + 두 손가락 핀치
    const ptrs = new Map();
    let pinchStart = null;
    el.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      selectPlacement(i);
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { el.setPointerCapture(e.pointerId); } catch {}
      if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()];
        pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), s: p.s || 1 };
      }
    });
    el.addEventListener("pointermove", (e) => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const r = printSheet.getBoundingClientRect();
      if (ptrs.size >= 2 && pinchStart) {
        // 🤏 핀치: 오브젝 자체를 늘리고 줄이기
        const [a, b] = [...ptrs.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        p.s = Math.min(2.2, Math.max(0.3, pinchStart.s * d / pinchStart.d));
        applySize();
      } else if (ptrs.size === 1) {
        // ✋ 드래그 이동
        p.x = Math.min(0.97, Math.max(0.03, (e.clientX - r.left) / r.width));
        p.y = Math.min(0.97, Math.max(0.03, (e.clientY - r.top) / r.height));
        applySize();
      }
    });
    const release = (e) => {
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pinchStart = null;
      if (ptrs.size === 0) saveDB();
    };
    el.addEventListener("pointerup", release);
    el.addEventListener("pointercancel", release);

    // 🟢 모서리 핸들: 끌어서 늘리기
    const handle = document.createElement("span");
    handle.className = "rs-handle";
    handle.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      selectPlacement(i);
      try { handle.setPointerCapture(e.pointerId); } catch {}
      const r = printSheet.getBoundingClientRect();
      const cx = r.left + p.x * r.width, cy = r.top + p.y * r.height;
      const start = { d: Math.hypot(e.clientX - cx, e.clientY - cy), s: p.s || 1 };
      const move = (ev) => {
        const d = Math.hypot(ev.clientX - cx, ev.clientY - cy);
        p.s = Math.min(2.2, Math.max(0.3, start.s * d / Math.max(start.d, 1)));
        applySize();
      };
      const up = () => {
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        saveDB();
      };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
    });
    el.appendChild(handle);
    printSheet.appendChild(el);
  });
  selectPlacement(null);
}

printSheet.addEventListener("pointerdown", () => selectPlacement(null));

printDeleteBtn.addEventListener("click", () => {
  if (printSel === null) return;
  const removed = folderLayout().splice(printSel, 1)[0];
  const f = currentFolder();
  if (!folderLayout().some(p => p.idx === removed.idx)) {
    f.printSkip = f.printSkip || {};
    f.printSkip[removed.idx] = true;   // 자동 재입장 방지
  }
  saveDB();
  renderPlacements();
});

document.getElementById("printBtn").addEventListener("click", () => {
  buildTray();
  printPage.classList.add("open");
  requestAnimationFrame(() => {
    ensureAllPlaced();   // 파우치 오브젝 전원 자동 입장
    renderPlacements();
  });
});
document.getElementById("printBack").addEventListener("click", () => {
  printPage.classList.remove("open");
});

// 🖨️ 신청: A4 고해상도(1240×1754) 인쇄 파일 생성 + 저장
document.getElementById("printOrder").addEventListener("click", async () => {
  const layout = folderLayout();
  if (!layout.length) { alert("시트에 스티커를 하나 이상 올려주세요!"); return; }
  const W = 1240, H = 1754;   // A4 150dpi
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);
  const sheetW = printSheet.clientWidth;
  for (const p of layout) {
    const st = currentFolder().stickers[p.idx];
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = st.url; });
    const s = placeSize(st, p);
    const w = s.w / sheetW * W, h = s.h / (printSheet.clientHeight) * H;
    const x = p.x * W - w / 2, y = p.y * H - h / 2;
    // 흰색 다이컷 테두리 (실루엣을 흰색으로 8방향 스탬프)
    const sil = document.createElement("canvas");
    sil.width = Math.ceil(w); sil.height = Math.ceil(h);
    const sctx = sil.getContext("2d");
    sctx.drawImage(img, 0, 0, sil.width, sil.height);
    sctx.globalCompositeOperation = "source-in";
    sctx.fillStyle = "#ffffff";
    sctx.fillRect(0, 0, sil.width, sil.height);
    const E = Math.max(4, w * 0.03);
    for (const [dx, dy] of [[E,0],[-E,0],[0,E],[0,-E],[E,E],[E,-E],[-E,E],[-E,-E]]) {
      ctx.drawImage(sil, x + dx, y + dy, w, h);
    }
    ctx.drawImage(img, x, y, w, h);
  }
  const a = document.createElement("a");
  a.href = c.toDataURL("image/png");
  a.download = `pouch-print-${currentFolder().name}.png`;
  a.click();
  alert("🖨️ 인쇄용 파일이 저장됐어요!\nA4 규격(다이컷 테두리 포함)이라 인쇄소에 바로 맡길 수 있어요.\n※ 앱 내 자동 인쇄 주문은 추후 연동 예정!");
});

// ===== 시작 =====
window.addEventListener("resize", () => {
  buildWalls();
  if (mode === "grid") enterGrid(); else rescue();
  if (folderListEl.classList.contains("open")) buildFolderObjects();
});
buildWalls();
spawnStickers();
currentFolder().stickers.forEach((item, i) => spawnPhotoSticker(item, false, i));  // 채집품 복원
folderNameEl.textContent = currentFolder().name;
saveDB();
Runner.run(Runner.create(), engine);
render();
openDrawer();   // 시작 화면 = 홈(파우치 스테이지)
</script>
