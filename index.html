<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pouch! — 파우치 프로토타입</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0d0d0f;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    color: #f2f2ee;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    gap: 12px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #d6ff4b;
    font-style: italic;
  }
  #alignBtn {
    flex: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    background: rgba(255,255,255,0.1);
    color: #f2f2ee;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #alignBtn.grid {
    background: rgba(214,255,75,0.15);
    color: #d6ff4b;
    border-color: rgba(214,255,75,0.5);
  }

  /* ===== 누끼 처리중 오버레이 ===== */
  #processing {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(13,13,15,0.88);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  #processing.open { display: flex; }
  #processing .scissors { font-size: 52px; animation: snip 0.9s ease-in-out infinite; }
  @keyframes snip {
    0%, 100% { transform: rotate(-12deg); }
    50% { transform: rotate(12deg) scale(1.1); }
  }
  #processing p { font-size: 16px; font-weight: 700; color: #d6ff4b; }
  #processing small { color: #8a8a85; font-size: 12px; padding: 0 32px; }

  /* ===== 투명 파우치 ===== */
  #pouch {
    position: relative;
    flex: 1;
    border-radius: 28px;
    overflow: hidden;
    background: linear-gradient(155deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.07));
    border: 1.5px solid rgba(255,255,255,0.22);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.25),
      inset 0 -20px 40px rgba(0,0,0,0.35),
      0 20px 60px rgba(0,0,0,0.6);
  }
  /* 비닐 광택 하이라이트 */
  #pouch::before {
    content: "";
    position: absolute;
    top: -30%;
    left: -20%;
    width: 70%;
    height: 80%;
    background: linear-gradient(120deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 60%);
    transform: rotate(-8deg);
    pointer-events: none;
    z-index: 5;
  }
  /* 파우치 지퍼 라인 */
  #pouch::after {
    content: "";
    position: absolute;
    top: 10px;
    left: 16px;
    right: 16px;
    height: 6px;
    border-radius: 3px;
    background: repeating-linear-gradient(90deg,
      rgba(255,255,255,0.28) 0 8px,
      rgba(255,255,255,0.08) 8px 16px);
    pointer-events: none;
    z-index: 5;
  }

  .sticker {
    position: absolute;
    top: 0;
    left: 0;
    display: grid;
    place-items: center;
    will-change: transform;
    cursor: grab;
    /* 블러 없는 쨍한 화이트 다이컷 테두리 */
    filter:
      drop-shadow(2px 0 0 #fff)
      drop-shadow(-2px 0 0 #fff)
      drop-shadow(0 2px 0 #fff)
      drop-shadow(0 -2px 0 #fff);
  }
  .sticker.dragging { cursor: grabbing; }
  /* 카메라로 채집한 누끼 스티커 — 테두리가 피사체 윤곽선을 따라감 */
  .sticker.photo {
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }

  footer {
    display: flex;
    gap: 10px;
  }
  button {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.08s;
  }
  button:active { transform: scale(0.96); }
  #shakeBtn {
    background: #d6ff4b;
    color: #111;
  }
  #tiltBtn {
    background: rgba(255,255,255,0.1);
    color: #f2f2ee;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #tiltBtn.on {
    background: rgba(214,255,75,0.15);
    color: #d6ff4b;
    border-color: rgba(214,255,75,0.5);
  }

  /* ===== 카메라 화면 ===== */
  #camera {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #000;
  }
  #camera.open { display: block; }
  #camera video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #camera .cam-ui {
    position: absolute;
    left: 0; right: 0;
    bottom: max(28px, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #shutter {
    width: 74px; height: 74px;
    flex: none;
    border-radius: 50%;
    background: #fff;
    border: 5px solid rgba(255,255,255,0.4);
    background-clip: padding-box;
    padding: 0;
  }
  #closeCam {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    width: 44px; height: 44px;
    flex: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 20px;
    padding: 0;
  }
  #camBtn { flex: 0.7; background: rgba(255,255,255,0.1); color: #f2f2ee; border: 1px solid rgba(255,255,255,0.2); }

  /* ===== 가로모드 안내 오버레이 ===== */
  #rotateGuard {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99;
    background: #0d0d0f;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
  }
  #rotateGuard .phone {
    font-size: 56px;
    animation: turnUp 1.6s ease-in-out infinite;
  }
  @keyframes turnUp {
    0%, 20%  { transform: rotate(90deg); }
    60%, 100% { transform: rotate(0deg); }
  }
  #rotateGuard p {
    font-size: 16px;
    font-weight: 700;
    color: #d6ff4b;
  }
  #rotateGuard small { color: #8a8a85; font-size: 13px; }
  /* 폰·태블릿 크기에서 가로로 돌리면 발동 (높이가 낮아진 상태) */
  @media (orientation: landscape) and (max-height: 500px) {
    #rotateGuard { display: flex; }
  }
</style>
</head>
<body>
<div id="processing">
  <div class="scissors">✂️</div>
  <p>누끼 따는 중...</p>
  <small>첫 채집은 AI 모델을 내려받느라 시간이 걸릴 수 있어요 (한 번만!)</small>
</div>

<div id="rotateGuard">
  <div class="phone">📱</div>
  <p>세로로 돌려주세요!</p>
  <small>Pouch!는 세로 화면에서 즐기는 앱이에요</small>
</div>

<div id="app">
  <header>
    <div class="logo">Pouch!</div>
    <button id="alignBtn">🧲 정렬</button>
  </header>

  <div id="pouch"></div>

  <footer>
    <button id="camBtn">📸 채집</button>
    <button id="tiltBtn">📱 기울기 켜기</button>
    <button id="shakeBtn">🫨 흔들기</button>
  </footer>
</div>

<div id="camera">
  <video playsinline autoplay muted></video>
  <button id="closeCam">✕</button>
  <div class="cam-ui">
    <button id="shutter" aria-label="촬영"></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite, Runner } = Matter;

const pouch = document.getElementById("pouch");
const engine = Engine.create();
engine.gravity.y = 1;
engine.positionIterations = 10;  // 벽 뚫기 방지: 계산 정밀도 UP
engine.velocityIterations = 8;

// ===== 스티커 데이터 (나중엔 누끼 딴 사진이 여기 들어감!) =====
const STICKERS = [
  { emoji: "🍓", size: 72 },
  { emoji: "📷", size: 80 },
  { emoji: "🧸", size: 88 },
  { emoji: "💿", size: 76 },
  { emoji: "🌷", size: 72 },
  { emoji: "🥐", size: 80 },
  { emoji: "⭐️", size: 64 },
  { emoji: "🎧", size: 76 },
];

const bodies = [];   // { body, el, size }
let walls = [];

function pouchSize() {
  return { w: pouch.clientWidth, h: pouch.clientHeight };
}

// ===== 벽 만들기 (파우치 안쪽 경계) =====
function buildWalls() {
  walls.forEach(w => Composite.remove(engine.world, w));
  const { w, h } = pouchSize();
  const t = 120; // 두꺼운 벽 (터널링 방지)
  walls = [
    Bodies.rectangle(w / 2, -t / 2 + 4, w * 2, t, { isStatic: true }),      // 위
    Bodies.rectangle(w / 2, h + t / 2 - 4, w * 2, t, { isStatic: true }),  // 아래
    Bodies.rectangle(-t / 2 + 4, h / 2, t, h * 2, { isStatic: true }),      // 왼쪽
    Bodies.rectangle(w + t / 2 - 4, h / 2, t, h * 2, { isStatic: true }),  // 오른쪽
  ];
  Composite.add(engine.world, walls);
}

// ===== 스티커 생성 =====
function makeBody(x, y, size) {
  const body = Bodies.circle(x, y, size / 2, {
    restitution: 0.55,
    friction: 0.05,
    frictionAir: 0.015,
    density: 0.0015,
  });
  Body.setAngle(body, (Math.random() - 0.5) * 0.8);
  Composite.add(engine.world, body);
  return body;
}

function spawnStickers() {
  const { w } = pouchSize();
  STICKERS.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "sticker";
    el.textContent = s.emoji;
    el.style.fontSize = s.size * 0.82 + "px";
    el.style.width = s.size + "px";
    el.style.height = s.size + "px";
    pouch.appendChild(el);
    const x = 40 + Math.random() * (w - 80);
    const y = 40 + (i % 4) * 60 + Math.random() * 30;
    bodies.push({ body: makeBody(x, y, s.size), el, size: s.size });
  });
}

// 카메라로 채집한 스티커 (누끼 PNG, 원본 비율 유지)
function spawnPhotoSticker(item, dropFromTop) {
  const { w } = pouchSize();
  const MAX = 110;
  const k = MAX / Math.max(item.w, item.h);
  const ew = Math.round(item.w * k), eh = Math.round(item.h * k);
  const size = Math.max(ew, eh);
  const el = document.createElement("div");
  el.className = "sticker photo";
  el.style.width = ew + "px";
  el.style.height = eh + "px";
  el.style.backgroundImage = `url(${item.url})`;
  pouch.appendChild(el);
  const x = 60 + Math.random() * (w - 120);
  const y = dropFromTop ? 60 : 120 + Math.random() * 100;
  bodies.push({ body: makeBody(x, y, size), el, size, ew, eh });
  if (mode === "grid") enterGrid();  // 정렬 모드 중이면 새 스티커도 줄맞춤
}

// ===== 보관함 (브라우저 저장소) =====
const STORE_KEY = "pouch_stickers_v2";

function loadCollection() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}
function saveToCollection(item) {
  const list = loadCollection();
  list.push(item);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
  catch { alert("보관함이 가득 찼어요! (저장 공간 부족)"); }
}

// ===== 탈출 감지 & 구조대 =====
const MAX_SPEED = 28;
function rescue() {
  const { w, h } = pouchSize();
  for (const { body, size } of bodies) {
    const r = size / 2;
    const { x, y } = body.position;
    // 파우치 밖으로 나갔으면 안쪽으로 즉시 복귀
    if (x < -r || x > w + r || y < -r || y > h + r) {
      Body.setPosition(body, {
        x: Math.min(Math.max(x, r + 4), w - r - 4),
        y: Math.min(Math.max(y, r + 4), h - r - 4),
      });
      Body.setVelocity(body, { x: 0, y: 0 });
    }
    // 과속 방지 (터널링의 주범)
    const v = body.velocity;
    const speed = Math.hypot(v.x, v.y);
    if (speed > MAX_SPEED) {
      const k = MAX_SPEED / speed;
      Body.setVelocity(body, { x: v.x * k, y: v.y * k });
    }
  }
}

// ===== 정렬 모드 (자유 ↔ 격자) =====
let mode = "free";
const gridTargets = new Map();
const alignBtn = document.getElementById("alignBtn");

function enterGrid() {
  const { w } = pouchSize();
  const cell = 112, gap = 10, margin = 22;
  const cols = Math.max(1, Math.floor((w - margin * 2 + gap) / (cell + gap)));
  gridTargets.clear();
  bodies.forEach((item, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    gridTargets.set(item.body.id, {
      x: margin + col * (cell + gap) + cell / 2,
      y: margin + 24 + row * (cell + gap) + cell / 2,
    });
    Body.setStatic(item.body, true);
  });
}

function exitGrid() {
  gridTargets.clear();
  for (const { body } of bodies) Body.setStatic(body, false);
}

alignBtn.addEventListener("click", () => {
  if (mode === "free") {
    mode = "grid";
    enterGrid();
    alignBtn.textContent = "🌀 자유";
    alignBtn.classList.add("grid");
  } else {
    mode = "free";
    exitGrid();
    alignBtn.textContent = "🧲 정렬";
    alignBtn.classList.remove("grid");
  }
});

// ===== 화면 동기화 =====
function render() {
  if (mode === "grid") {
    // 격자 목표 지점으로 스르륵 이동
    for (const { body } of bodies) {
      const t = gridTargets.get(body.id);
      if (!t) continue;
      const p = body.position;
      Body.setPosition(body, { x: p.x + (t.x - p.x) * 0.16, y: p.y + (t.y - p.y) * 0.16 });
      Body.setAngle(body, body.angle * 0.84);  // 각도도 반듯하게
    }
  } else {
    rescue();
  }
  for (const { body, el, size, ew, eh } of bodies) {
    const x = body.position.x - (ew || size) / 2;
    const y = body.position.y - (eh || size) / 2;
    el.style.transform = `translate(${x}px, ${y}px) rotate(${body.angle}rad)`;
  }
  requestAnimationFrame(render);
}

// ===== 드래그 & 던지기 =====
let drag = null; // { item, lastX, lastY, lastT }

pouch.addEventListener("pointerdown", (e) => {
  if (mode === "grid") return;  // 정렬 모드에선 드래그 잠금
  const rect = pouch.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  // 가장 가까운 스티커 찾기
  let best = null, bestD = 1e9;
  for (const item of bodies) {
    const dx = item.body.position.x - px;
    const dy = item.body.position.y - py;
    const d = Math.hypot(dx, dy);
    if (d < item.size * 0.7 && d < bestD) { best = item; bestD = d; }
  }
  if (best) {
    drag = { item: best, lastX: px, lastY: py, lastT: performance.now() };
    best.el.classList.add("dragging");
    Body.setStatic(best.body, true);
    pouch.setPointerCapture(e.pointerId);
  }
});

pouch.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const rect = pouch.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  Body.setPosition(drag.item.body, { x: px, y: py });
  const now = performance.now();
  const dt = Math.max(now - drag.lastT, 1);
  drag.vx = (px - drag.lastX) / dt * 16;
  drag.vy = (py - drag.lastY) / dt * 16;
  drag.lastX = px; drag.lastY = py; drag.lastT = now;
});

function endDrag() {
  if (!drag) return;
  const { item, vx = 0, vy = 0 } = drag;
  item.el.classList.remove("dragging");
  Body.setStatic(item.body, false);
  Body.setVelocity(item.body, {
    x: Math.max(-25, Math.min(25, vx)),
    y: Math.max(-25, Math.min(25, vy)),
  });
  drag = null;
}
pouch.addEventListener("pointerup", endDrag);
pouch.addEventListener("pointercancel", endDrag);

// ===== 기울기 센서 → 중력 =====
const tiltBtn = document.getElementById("tiltBtn");

function handleOrientation(e) {
  if (e.gamma == null || e.beta == null) return;
  // gamma: 좌우 기울기(-90~90), beta: 앞뒤 기울기(-180~180)
  const gx = Math.max(-1, Math.min(1, e.gamma / 40));
  const gy = Math.max(-1, Math.min(1, e.beta / 40));
  engine.gravity.x = gx;
  engine.gravity.y = gy;
}

tiltBtn.addEventListener("click", async () => {
  // iOS 13+ 는 권한 요청 필요
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== "granted") { alert("기울기 권한이 거부되었어요 🥲"); return; }
    } catch (err) {
      alert("기울기 센서는 HTTPS 주소에서만 작동해요!");
      return;
    }
  }
  window.addEventListener("deviceorientation", handleOrientation);
  tiltBtn.textContent = "📱 기울기 ON";
  tiltBtn.classList.add("on");
});

// ===== 흔들기 버튼 =====
document.getElementById("shakeBtn").addEventListener("click", () => {
  if (mode === "grid") alignBtn.click();  // 정렬 풀고 흔들기!
  for (const { body } of bodies) {
    Body.setVelocity(body, {
      x: (Math.random() - 0.5) * 30,
      y: -Math.random() * 22 - 6,
    });
    Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.6);
  }
});

// ===== 카메라 =====
const cameraEl = document.getElementById("camera");
const videoEl = cameraEl.querySelector("video");
let stream = null;

document.getElementById("camBtn").addEventListener("click", async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },  // 후면 카메라 우선
      audio: false,
    });
    videoEl.srcObject = stream;
    cameraEl.classList.add("open");
  } catch (err) {
    alert("카메라를 열 수 없어요. 권한을 허용했는지 확인해주세요! (HTTPS 필수)");
  }
});

function closeCamera() {
  cameraEl.classList.remove("open");
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
document.getElementById("closeCam").addEventListener("click", closeCamera);

// ===== AI 누끼 =====
const processingEl = document.getElementById("processing");
let removeBackgroundFn = null;

async function getNukkiEngine() {
  if (!removeBackgroundFn) {
    const mod = await import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm");
    removeBackgroundFn = mod.removeBackground;
  }
  return removeBackgroundFn;
}

// 투명 여백을 잘라내고 알맞은 크기로 축소
function trimAndShrink(img) {
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 20) {  // 알파값 있는 픽셀
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX <= minX || maxY <= minY) return null;  // 전부 투명 = 누끼 실패
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const k = Math.min(1, 220 / Math.max(bw, bh));
  const out = document.createElement("canvas");
  out.width = Math.round(bw * k); out.height = Math.round(bh * k);
  out.getContext("2d").drawImage(c, minX, minY, bw, bh, 0, 0, out.width, out.height);
  return { url: out.toDataURL("image/png"), w: out.width, h: out.height };
}

document.getElementById("shutter").addEventListener("click", async () => {
  const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
  if (!vw || !vh) return;
  // 중앙 정사각형 512px로 캡처
  const s = Math.min(vw, vh);
  const cap = document.createElement("canvas");
  cap.width = 512; cap.height = 512;
  cap.getContext("2d").drawImage(videoEl, (vw - s) / 2, (vh - s) / 2, s, s, 0, 0, 512, 512);
  closeCamera();
  processingEl.classList.add("open");

  let item = null;
  try {
    const removeBackground = await getNukkiEngine();
    const blob = await new Promise(r => cap.toBlob(r, "image/png"));
    const cutBlob = await removeBackground(blob);
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res; img.onerror = rej;
      img.src = URL.createObjectURL(cutBlob);
    });
    item = trimAndShrink(img);
  } catch (err) {
    item = null;  // 누끼 실패 → 폴백
  }
  if (!item) {
    // 폴백: 누끼 없이 원본 정사각으로 채집
    const fb = document.createElement("canvas");
    fb.width = 200; fb.height = 200;
    fb.getContext("2d").drawImage(cap, 0, 0, 200, 200);
    item = { url: fb.toDataURL("image/jpeg", 0.82), w: 200, h: 200 };
    alert("누끼에 실패해서 원본으로 채집했어요 🥲 (네트워크를 확인해보세요)");
  }
  processingEl.classList.remove("open");
  saveToCollection(item);
  spawnPhotoSticker(item, true);
});

// ===== 시작 =====
window.addEventListener("resize", () => {
  buildWalls();
  if (mode === "grid") enterGrid(); else rescue();
});
buildWalls();
spawnStickers();
loadCollection().forEach(item => spawnPhotoSticker(item, false));  // 채집품 복원
Runner.run(Runner.create(), engine);
render();
</script>
