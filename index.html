<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pouch! — 파우치 프로토타입</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0d0d0f;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    color: #f2f2ee;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    gap: 12px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #d6ff4b;
    font-style: italic;
  }
  #alignBtn {
    flex: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 14px;
    background: rgba(255,255,255,0.1);
    color: #f2f2ee;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #alignBtn.grid {
    background: rgba(214,255,75,0.15);
    color: #d6ff4b;
    border-color: rgba(214,255,75,0.5);
  }
  .title-group { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .folder-name {
    font-size: 13px;
    color: #8a8a85;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-btns { display: flex; gap: 8px; flex: none; }
  #listBtn {
    flex: none;
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 17px;
    background: rgba(255,255,255,0.1);
    color: #f2f2ee;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 0;
  }

  /* ===== 페이지 (목록/편집) ===== */
  .page {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 45;
    background: #0d0d0f;
    flex-direction: column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    gap: 18px;
    overflow-y: auto;
  }
  .page.open { display: flex; }
  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .page-head h2 { font-size: 18px; font-weight: 800; }
  .round-btn {
    width: 44px; height: 44px;
    flex: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    color: #f2f2ee;
    border: 1px solid rgba(255,255,255,0.2);
    font-size: 19px;
    padding: 0;
  }
  .pill-btn {
    flex: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    background: rgba(255,255,255,0.1);
    color: #f2f2ee;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .pill-btn.save { background: #d6ff4b; color: #111; border: none; font-weight: 800; }

  /* 파우치 목록 격자 */
  #folderGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .folder-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 20px 12px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.12);
    cursor: pointer;
  }
  .folder-card.current { border-color: rgba(214,255,75,0.6); background: rgba(214,255,75,0.07); }
  .folder-card .fname { font-size: 14px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder-card .fcount { font-size: 11px; color: #8a8a85; }
  .folder-card .edit-btn {
    position: absolute;
    top: 8px; right: 8px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 13px;
    padding: 0;
  }
  .folder-card.new-card {
    justify-content: center;
    min-height: 150px;
    border-style: dashed;
    color: #8a8a85;
    font-size: 15px;
    font-weight: 700;
  }
  .folder-card.new-card .plus { font-size: 30px; color: #d6ff4b; }

  /* 편집 페이지 */
  #editPreview { display: grid; place-items: center; padding: 8px 0; }
  #editName {
    width: 100%;
    padding: 15px 18px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.07);
    color: #f2f2ee;
    font-size: 16px;
    font-family: inherit;
    text-align: center;
    outline: none;
  }
  #editName:focus { border-color: rgba(214,255,75,0.6); }
  .opt-label { font-size: 13px; color: #8a8a85; font-weight: 700; }
  .opts {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .opt {
    display: grid;
    place-items: center;
    aspect-ratio: 1.4;
    border-radius: 16px;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid transparent;
    padding: 0;
  }
  .opt.selected { border-color: #d6ff4b; background: rgba(214,255,75,0.08); }
  .opt .dot { width: 34px; height: 34px; border-radius: 50%; }
  #folderDelete {
    margin-top: auto;
    padding: 14px 0;
    border-radius: 16px;
    background: rgba(255,80,80,0.1);
    border: 1px solid rgba(255,80,80,0.4);
    color: #ff7b7b;
    font-weight: 700;
  }
  #folderDelete[hidden] { display: none; }

  /* ===== 누끼 처리중 오버레이 ===== */
  #processing {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(13,13,15,0.88);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  #processing.open { display: flex; }
  #processing .scissors { font-size: 52px; animation: snip 0.9s ease-in-out infinite; }
  @keyframes snip {
    0%, 100% { transform: rotate(-12deg); }
    50% { transform: rotate(12deg) scale(1.1); }
  }
  #processing p { font-size: 16px; font-weight: 700; color: #d6ff4b; }
  #processing small { color: #8a8a85; font-size: 12px; padding: 0 32px; }

  /* ===== 투명 파우치 ===== */
  #pouch {
    position: relative;
    flex: 1;
    border-radius: 28px;
    overflow: hidden;
    background: linear-gradient(155deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.07));
    border: 1.5px solid rgba(255,255,255,0.22);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.25),
      inset 0 -20px 40px rgba(0,0,0,0.35),
      0 20px 60px rgba(0,0,0,0.6);
  }
  /* 비닐 광택 하이라이트 */
  #pouch::before {
    content: "";
    position: absolute;
    top: -30%;
    left: -20%;
    width: 70%;
    height: 80%;
    background: linear-gradient(120deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 60%);
    transform: rotate(-8deg);
    pointer-events: none;
    z-index: 5;
  }
  /* 파우치 지퍼 라인 */
  #pouch::after {
    content: "";
    position: absolute;
    top: 10px;
    left: 16px;
    right: 16px;
    height: 6px;
    border-radius: 3px;
    background: repeating-linear-gradient(90deg,
      rgba(255,255,255,0.28) 0 8px,
      rgba(255,255,255,0.08) 8px 16px);
    pointer-events: none;
    z-index: 5;
  }

  .sticker {
    position: absolute;
    top: 0;
    left: 0;
    display: grid;
    place-items: center;
    will-change: transform;
    cursor: grab;
    /* 블러 없는 쨍한 화이트 다이컷 테두리 */
    filter:
      drop-shadow(2px 0 0 #fff)
      drop-shadow(-2px 0 0 #fff)
      drop-shadow(0 2px 0 #fff)
      drop-shadow(0 -2px 0 #fff);
  }
  .sticker.dragging { cursor: grabbing; }
  /* 카메라로 채집한 누끼 스티커 — 테두리가 피사체 윤곽선을 따라감 */
  .sticker.photo {
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }

  footer {
    display: flex;
    gap: 10px;
  }
  button {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.08s;
  }
  button:active { transform: scale(0.96); }
  #shakeBtn {
    background: #d6ff4b;
    color: #111;
  }
  #tiltBtn {
    background: rgba(255,255,255,0.1);
    color: #f2f2ee;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #tiltBtn.on {
    background: rgba(214,255,75,0.15);
    color: #d6ff4b;
    border-color: rgba(214,255,75,0.5);
  }

  /* ===== 카메라 화면 ===== */
  #camera {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #000;
  }
  #camera.open { display: block; }
  #camera video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #camera .cam-ui {
    position: absolute;
    left: 0; right: 0;
    bottom: max(28px, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #shutter {
    width: 74px; height: 74px;
    flex: none;
    border-radius: 50%;
    background: #fff;
    border: 5px solid rgba(255,255,255,0.4);
    background-clip: padding-box;
    padding: 0;
  }
  #closeCam {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    width: 44px; height: 44px;
    flex: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 20px;
    padding: 0;
  }
  #camBtn { flex: 0.7; background: rgba(255,255,255,0.1); color: #f2f2ee; border: 1px solid rgba(255,255,255,0.2); }
  #galleryBtn {
    position: absolute;
    left: 24px;
    bottom: 0;
    top: 0;
    margin: auto 0;
    width: 52px; height: 52px;
    flex: none;
    border-radius: 14px;
    background: rgba(0,0,0,0.5);
    border: 1.5px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 24px;
    padding: 0;
  }

  /* ===== 크기 조절 패널 ===== */
  .sticker.selected {
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  #resizePanel {
    display: none;
    position: fixed;
    left: 16px; right: 16px;
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 40;
    background: rgba(28,28,32,0.97);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  #resizePanel.open { display: block; }
  #resizePanel .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #resizePanel label { font-size: 14px; font-weight: 700; flex: none; }
  #sizeSlider {
    flex: 1;
    accent-color: #d6ff4b;
    height: 28px;
  }
  #sizeVal { flex: none; width: 48px; text-align: right; font-size: 13px; color: #d6ff4b; font-weight: 700; }
  #resizeDone {
    margin-top: 12px;
    width: 100%;
    padding: 12px 0;
    background: #d6ff4b;
    color: #111;
  }

  /* ===== 가로모드 안내 오버레이 ===== */
  #rotateGuard {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99;
    background: #0d0d0f;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
  }
  #rotateGuard .phone {
    font-size: 56px;
    animation: turnUp 1.6s ease-in-out infinite;
  }
  @keyframes turnUp {
    0%, 20%  { transform: rotate(90deg); }
    60%, 100% { transform: rotate(0deg); }
  }
  #rotateGuard p {
    font-size: 16px;
    font-weight: 700;
    color: #d6ff4b;
  }
  #rotateGuard small { color: #8a8a85; font-size: 13px; }
  /* 폰·태블릿 크기에서 가로로 돌리면 발동 (높이가 낮아진 상태) */
  @media (orientation: landscape) and (max-height: 500px) {
    #rotateGuard { display: flex; }
  }
</style>
</head>
<body>
<div id="processing">
  <div class="scissors">✂️</div>
  <p>누끼 따는 중...</p>
  <small>첫 채집은 AI 모델을 내려받느라 시간이 걸릴 수 있어요 (한 번만!)</small>
</div>

  <div class="phone">📱</div>
  <p>세로로 돌려주세요!</p>
  <small>Pouch!는 세로 화면에서 즐기는 앱이에요</small>
</div>

<div id="app">
  <header>
    <div class="title-group">
      <div class="logo">Pouch!</div>
      <div id="folderName" class="folder-name"></div>
    </div>
    <div class="header-btns">
      <button id="alignBtn">🧲 정렬</button>
      <button id="listBtn" aria-label="파우치 목록">🗂️</button>
    </div>
  </header>

  <div id="pouch"></div>

  <footer>
    <button id="camBtn">📸 채집</button>
    <button id="tiltBtn">📱 기울기 켜기</button>
    <button id="shakeBtn">🫨 흔들기</button>
  </footer>
</div>

<div id="camera">
  <video playsinline autoplay muted></video>
  <button id="closeCam">✕</button>
  <div class="cam-ui">
    <button id="galleryBtn" aria-label="앨범에서 가져오기">🖼️</button>
    <button id="shutter" aria-label="촬영"></button>
  </div>
  <input type="file" id="galleryInput" accept="image/*" hidden>
</div>

<div id="folderList" class="page">
  <div class="page-head">
    <button class="round-btn" id="closeList">✕</button>
    <h2>내 파우치</h2>
    <button class="round-btn" id="newFolderBtn">＋</button>
  </div>
  <div id="folderGrid"></div>
</div>

<div id="folderEdit" class="page">
  <div class="page-head">
    <button class="pill-btn" id="editCancel">취소</button>
    <h2>파우치 편집</h2>
    <button class="pill-btn save" id="editSave">저장</button>
  </div>
  <div id="editPreview"></div>
  <input id="editName" maxlength="12" placeholder="파우치 이름">
  <div class="opt-label">모양</div>
  <div id="shapeOpts" class="opts"></div>
  <div class="opt-label">색</div>
  <div id="colorOpts" class="opts"></div>
  <button id="folderDelete">🗑️ 파우치 삭제</button>
</div>

<div id="resizePanel">
  <div class="row">
    <label>📏 크기</label>
    <input type="range" id="sizeSlider" min="50" max="200" value="100">
    <span id="sizeVal">100%</span>
  </div>
  <button id="resizeDone">완료</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite, Runner } = Matter;

const pouch = document.getElementById("pouch");
const engine = Engine.create();
engine.gravity.y = 1;
engine.positionIterations = 10;  // 벽 뚫기 방지: 계산 정밀도 UP
engine.velocityIterations = 8;

// ===== 스티커 데이터 (나중엔 누끼 딴 사진이 여기 들어감!) =====
const STICKERS = [
  { emoji: "🍓", size: 72 },
  { emoji: "📷", size: 80 },
  { emoji: "🧸", size: 88 },
  { emoji: "💿", size: 76 },
  { emoji: "🌷", size: 72 },
  { emoji: "🥐", size: 80 },
  { emoji: "⭐️", size: 64 },
  { emoji: "🎧", size: 76 },
];

const bodies = [];   // { body, el, size }
let walls = [];

function pouchSize() {
  return { w: pouch.clientWidth, h: pouch.clientHeight };
}

// ===== 벽 만들기 (파우치 안쪽 경계) =====
function buildWalls() {
  walls.forEach(w => Composite.remove(engine.world, w));
  const { w, h } = pouchSize();
  const t = 120; // 두꺼운 벽 (터널링 방지)
  walls = [
    Bodies.rectangle(w / 2, -t / 2 + 4, w * 2, t, { isStatic: true }),      // 위
    Bodies.rectangle(w / 2, h + t / 2 - 4, w * 2, t, { isStatic: true }),  // 아래
    Bodies.rectangle(-t / 2 + 4, h / 2, t, h * 2, { isStatic: true }),      // 왼쪽
    Bodies.rectangle(w + t / 2 - 4, h / 2, t, h * 2, { isStatic: true }),  // 오른쪽
  ];
  Composite.add(engine.world, walls);
}

// ===== 스티커 생성 =====
function makeBody(x, y, size) {
  const body = Bodies.circle(x, y, size / 2, {
    restitution: 0.55,
    friction: 0.05,
    frictionAir: 0.015,
    density: 0.0015,
  });
  Body.setAngle(body, (Math.random() - 0.5) * 0.8);
  Composite.add(engine.world, body);
  return body;
}

function spawnStickers() {
  const { w } = pouchSize();
  STICKERS.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "sticker";
    el.textContent = s.emoji;
    el.style.fontSize = s.size * 0.82 + "px";
    el.style.width = s.size + "px";
    el.style.height = s.size + "px";
    pouch.appendChild(el);
    const x = 40 + Math.random() * (w - 80);
    const y = 40 + (i % 4) * 60 + Math.random() * 30;
    bodies.push({
      body: makeBody(x, y, s.size), el, size: s.size,
      baseSize: s.size, scale: 1, storeIdx: null,
    });
  });
}

// 카메라·앨범으로 채집한 스티커 (누끼 PNG, 원본 비율 유지)
function spawnPhotoSticker(item, dropFromTop, storeIdx) {
  const { w } = pouchSize();
  const MAX = 110;
  const k = MAX / Math.max(item.w, item.h);
  const bw = Math.round(item.w * k), bh = Math.round(item.h * k);
  const scale = item.scale || 1;
  const ew = Math.round(bw * scale), eh = Math.round(bh * scale);
  const size = Math.max(ew, eh);
  const el = document.createElement("div");
  el.className = "sticker photo";
  el.style.width = ew + "px";
  el.style.height = eh + "px";
  el.style.backgroundImage = `url(${item.url})`;
  pouch.appendChild(el);
  const x = 60 + Math.random() * (w - 120);
  const y = dropFromTop ? 60 : 120 + Math.random() * 100;
  bodies.push({
    body: makeBody(x, y, size), el, size, ew, eh,
    baseSize: Math.max(bw, bh), baseEw: bw, baseEh: bh, scale,
    storeIdx: storeIdx ?? null,
  });
  if (mode === "grid") enterGrid();  // 정렬 모드 중이면 새 스티커도 줄맞춤
}

// ===== 파우치(폴더) 저장소 v3 =====
const DB_KEY = "pouch_db_v3";
const STORE_KEY = DB_KEY;  // (구버전 호환용 별칭)

function loadDB() {
  try {
    const d = JSON.parse(localStorage.getItem(DB_KEY));
    if (d && d.folders && d.folders.length) return d;
  } catch {}
  // 첫 실행: 구버전(v2) 채집품이 있으면 기본 파우치로 이사
  let old = [];
  try { old = JSON.parse(localStorage.getItem("pouch_stickers_v2")) || []; } catch {}
  const d = {
    folders: [{ id: "f" + Date.now(), name: "기본 파우치", shape: "square", color: "#d6ff4b", stickers: old }],
    current: null,
  };
  d.current = d.folders[0].id;
  return d;
}

let db = loadDB();

function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch { alert("보관함이 가득 찼어요! (저장 공간 부족)"); }
}

function currentFolder() {
  return db.folders.find(f => f.id === db.current) || db.folders[0];
}

function loadCollection() { return currentFolder().stickers; }
function saveToCollection(item) {
  currentFolder().stickers.push(item);
  saveDB();
}

// ===== 탈출 감지 & 구조대 =====
const MAX_SPEED = 28;
function rescue() {
  const { w, h } = pouchSize();
  for (const { body, size } of bodies) {
    const r = size / 2;
    const { x, y } = body.position;
    // 파우치 밖으로 나갔으면 안쪽으로 즉시 복귀
    if (x < -r || x > w + r || y < -r || y > h + r) {
      Body.setPosition(body, {
        x: Math.min(Math.max(x, r + 4), w - r - 4),
        y: Math.min(Math.max(y, r + 4), h - r - 4),
      });
      Body.setVelocity(body, { x: 0, y: 0 });
    }
    // 과속 방지 (터널링의 주범)
    const v = body.velocity;
    const speed = Math.hypot(v.x, v.y);
    if (speed > MAX_SPEED) {
      const k = MAX_SPEED / speed;
      Body.setVelocity(body, { x: v.x * k, y: v.y * k });
    }
  }
}

// ===== 정렬 모드 (자유 ↔ 격자) =====
let mode = "free";
const gridTargets = new Map();
const alignBtn = document.getElementById("alignBtn");

function enterGrid() {
  const { w } = pouchSize();
  const cell = 112, gap = 10, margin = 22;
  const cols = Math.max(1, Math.floor((w - margin * 2 + gap) / (cell + gap)));
  gridTargets.clear();
  bodies.forEach((item, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    gridTargets.set(item.body.id, {
      x: margin + col * (cell + gap) + cell / 2,
      y: margin + 24 + row * (cell + gap) + cell / 2,
    });
    Body.setStatic(item.body, true);
  });
}

function exitGrid() {
  gridTargets.clear();
  for (const { body } of bodies) Body.setStatic(body, false);
}

alignBtn.addEventListener("click", () => {
  if (mode === "free") {
    mode = "grid";
    enterGrid();
    alignBtn.textContent = "🌀 자유";
    alignBtn.classList.add("grid");
  } else {
    mode = "free";
    exitGrid();
    alignBtn.textContent = "🧲 정렬";
    alignBtn.classList.remove("grid");
  }
});

// ===== 화면 동기화 =====
function render() {
  if (mode === "grid") {
    // 격자 목표 지점으로 스르륵 이동
    for (const { body } of bodies) {
      const t = gridTargets.get(body.id);
      if (!t) continue;
      const p = body.position;
      Body.setPosition(body, { x: p.x + (t.x - p.x) * 0.16, y: p.y + (t.y - p.y) * 0.16 });
      Body.setAngle(body, body.angle * 0.84);  // 각도도 반듯하게
    }
  } else {
    rescue();
  }
  for (const { body, el, size, ew, eh } of bodies) {
    const x = body.position.x - (ew || size) / 2;
    const y = body.position.y - (eh || size) / 2;
    el.style.transform = `translate(${x}px, ${y}px) rotate(${body.angle}rad)`;
  }
  requestAnimationFrame(render);
}

// ===== 드래그 & 던지기 & 길게 누르기 =====
let drag = null; // { item, lastX, lastY, lastT }
let press = null; // 길게 누르기 감시 { item, x0, y0, timer }
const LONG_PRESS_MS = 550;

pouch.addEventListener("pointerdown", (e) => {
  if (mode === "grid") return;  // 정렬 모드에선 드래그 잠금
  if (resizeTarget) return;      // 크기조절 중엔 잠금
  const rect = pouch.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  // 가장 가까운 스티커 찾기
  let best = null, bestD = 1e9;
  for (const item of bodies) {
    const dx = item.body.position.x - px;
    const dy = item.body.position.y - py;
    const d = Math.hypot(dx, dy);
    if (d < item.size * 0.7 && d < bestD) { best = item; bestD = d; }
  }
  if (best) {
    drag = { item: best, lastX: px, lastY: py, lastT: performance.now() };
    best.el.classList.add("dragging");
    Body.setStatic(best.body, true);
    pouch.setPointerCapture(e.pointerId);
    // 길게 누르기 타이머: 거의 안 움직이고 0.55초 지나면 크기조절 모드
    press = {
      item: best, x0: px, y0: py,
      timer: setTimeout(() => {
        if (drag && drag.item === best) {
          drag.item.el.classList.remove("dragging");
          drag = null;
          openResize(best);
        }
      }, LONG_PRESS_MS),
    };
  }
});

pouch.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const rect = pouch.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  // 8px 이상 움직이면 길게 누르기 취소 (드래그 확정)
  if (press && Math.hypot(px - press.x0, py - press.y0) > 8) {
    clearTimeout(press.timer);
    press = null;
  }
  Body.setPosition(drag.item.body, { x: px, y: py });
  const now = performance.now();
  const dt = Math.max(now - drag.lastT, 1);
  drag.vx = (px - drag.lastX) / dt * 16;
  drag.vy = (py - drag.lastY) / dt * 16;
  drag.lastX = px; drag.lastY = py; drag.lastT = now;
});

function endDrag() {
  if (press) { clearTimeout(press.timer); press = null; }
  if (!drag) return;
  const { item, vx = 0, vy = 0 } = drag;
  item.el.classList.remove("dragging");
  Body.setStatic(item.body, false);
  Body.setVelocity(item.body, {
    x: Math.max(-25, Math.min(25, vx)),
    y: Math.max(-25, Math.min(25, vy)),
  });
  drag = null;
}
pouch.addEventListener("pointerup", endDrag);
pouch.addEventListener("pointercancel", endDrag);

let resizeTarget = null;
const resizePanel = document.getElementById("resizePanel");
const sizeSlider = document.getElementById("sizeSlider");
const sizeVal = document.getElementById("sizeVal");

function openResize(item) {
  resizeTarget = item;
  Body.setStatic(item.body, true);  // 조절하는 동안 공중 정지
  item.el.classList.add("selected");
  sizeSlider.value = Math.round(item.scale * 100);
  sizeVal.textContent = sizeSlider.value + "%";
  resizePanel.classList.add("open");
  if (navigator.vibrate) navigator.vibrate(30);  // 촉각 피드백 (안드로이드)
}

function applyScale(item, s) {
  item.scale = s;
  const newEw = Math.round((item.baseEw || item.baseSize) * s);
  const newEh = Math.round((item.baseEh || item.baseSize) * s);
  const newSize = Math.max(newEw, newEh);
  // 몸체를 새로 만들어 교체 (정지 상태에서 scale하면 질량이 ∞로 굳는 버그 회피)
  const pos = { x: item.body.position.x, y: item.body.position.y };
  const angle = item.body.angle;
  Composite.remove(engine.world, item.body);
  item.body = makeBody(pos.x, pos.y, newSize);
  Body.setAngle(item.body, angle);
  Body.setStatic(item.body, true);  // 조절 중엔 계속 공중 정지
  item.size = newSize;
  if (item.ew !== undefined) { item.ew = newEw; item.eh = newEh; }
  item.el.style.width = newEw + "px";
  item.el.style.height = newEh + "px";
  if (!item.el.classList.contains("photo")) {
    item.el.style.fontSize = item.baseSize * s * 0.82 + "px";
  }
  // 채집품이면 현재 파우치에 크기 저장
  if (item.storeIdx !== null) {
    const list = currentFolder().stickers;
    if (list[item.storeIdx]) {
      list[item.storeIdx].scale = s;
      saveDB();
    }
  }
}

sizeSlider.addEventListener("input", () => {
  if (!resizeTarget) return;
  sizeVal.textContent = sizeSlider.value + "%";
  applyScale(resizeTarget, sizeSlider.value / 100);
});

document.getElementById("resizeDone").addEventListener("click", () => {

  resizeTarget = null;

});

const tiltBtn = document.getElementById("tiltBtn");

function handleOrientation(e) {
  if (e.gamma == null || e.beta == null) return;
  // gamma: 좌우 기울기(-90~90), beta: 앞뒤 기울기(-180~180)
  const gx = Math.max(-1, Math.min(1, e.gamma / 40));
  const gy = Math.max(-1, Math.min(1, e.beta / 40));
  engine.gravity.x = gx;
  engine.gravity.y = gy;
}

tiltBtn.addEventListener("click", async () => {
  // iOS 13+ 는 권한 요청 필요
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== "granted") { alert("기울기 권한이 거부되었어요 🥲"); return; }
    } catch (err) {
      alert("기울기 센서는 HTTPS 주소에서만 작동해요!");
      return;
    }
  }
  window.addEventListener("deviceorientation", handleOrientation);
  tiltBtn.textContent = "📱 기울기 ON";

});

const processingEl = document.getElementById("processing");
let removeBackgroundFn = null;

async function getNukkiEngine() {
  if (!removeBackgroundFn) {
    const mod = await import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm");
    removeBackgroundFn = mod.removeBackground;
  }
  return removeBackgroundFn;
}

// 투명 여백을 잘라내고 알맞은 크기로 축소
function trimAndShrink(img) {
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 20) {  // 알파값 있는 픽셀
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX <= minX || maxY <= minY) return null;  // 전부 투명 = 누끼 실패
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const k = Math.min(1, 220 / Math.max(bw, bh));
  const out = document.createElement("canvas");
  out.width = Math.round(bw * k); out.height = Math.round(bh * k);
  out.getContext("2d").drawImage(c, minX, minY, bw, bh, 0, 0, out.width, out.height);
  return { url: out.toDataURL("image/png"), w: out.width, h: out.height };
}

// 촬영/앨범 공용 파이프라인: 캔버스 → AI 누끼 → 보관 → 파우치 투하
async function processAndCollect(cap) {
  processingEl.classList.add("open");
  let item = null;
  try {
    const removeBackground = await getNukkiEngine();
    const blob = await new Promise(r => cap.toBlob(r, "image/png"));
    const cutBlob = await removeBackground(blob);
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res; img.onerror = rej;
      img.src = URL.createObjectURL(cutBlob);
    });
    item = trimAndShrink(img);
  } catch (err) {
    item = null;  // 누끼 실패 → 폴백
  }
  if (!item) {
    // 폴백: 누끼 없이 원본으로 채집
    const k = Math.min(1, 200 / Math.max(cap.width, cap.height));
    const fb = document.createElement("canvas");
    fb.width = Math.round(cap.width * k); fb.height = Math.round(cap.height * k);
    fb.getContext("2d").drawImage(cap, 0, 0, fb.width, fb.height);
    item = { url: fb.toDataURL("image/jpeg", 0.82), w: fb.width, h: fb.height };
    alert("누끼에 실패해서 원본으로 채집했어요 🥲 (네트워크를 확인해보세요)");
  }
  processingEl.classList.remove("open");
  saveToCollection(item);
  spawnPhotoSticker(item, true, loadCollection().length - 1);
}

document.getElementById("shutter").addEventListener("click", () => {
  const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
  if (!vw || !vh) return;
  // 중앙 정사각형 512px로 캡처
  const s = Math.min(vw, vh);
  const cap = document.createElement("canvas");
  cap.width = 512; cap.height = 512;
  cap.getContext("2d").drawImage(videoEl, (vw - s) / 2, (vh - s) / 2, s, s, 0, 0, 512, 512);
  closeCamera();
  processAndCollect(cap);
});

const galleryInput = document.getElementById("galleryInput");
document.getElementById("galleryBtn").addEventListener("click", () => galleryInput.click());

galleryInput.addEventListener("change", async () => {
  const file = galleryInput.files && galleryInput.files[0];
  galleryInput.value = "";
  if (!file) return;
  try {
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res; img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
    // 비율 유지, 최대 640px로 축소해서 파이프라인 투입
    const k = Math.min(1, 640 / Math.max(img.width, img.height));
    const cap = document.createElement("canvas");
    cap.width = Math.round(img.width * k);
    cap.height = Math.round(img.height * k);
    cap.getContext("2d").drawImage(img, 0, 0, cap.width, cap.height);
    closeCamera();
    processAndCollect(cap);
  } catch {
    alert("이미지를 읽을 수 없어요. 다른 사진으로 시도해보세요!");
  }
});

// ===== 파우치 모양/색 (Catch 스타일) =====
const SHAPE_LIST = ["circle", "square", "triangle", "star", "hex", "heart"];
const COLOR_LIST = ["#d6ff4b", "#c9b6f8", "#f2d478", "#ff8a8a", "#9cd2fb", "#a8e6cf", "#f9c4e1", "#fbc98c"];

function shapeSVG(shape, color, size) {
  const paths = {
    triangle: "M50 10 L92 85 L8 85 Z",
    star: "M50 6 L61 38 L95 38 L67 58 L78 92 L50 71 L22 92 L33 58 L5 38 L39 38 Z",
    hex: "M28 12 L72 12 L94 50 L72 88 L28 88 L6 50 Z",
    heart: "M50 88 C20 64 6 46 6 30 C6 16 17 8 29 8 C38 8 46 13 50 21 C54 13 62 8 71 8 C83 8 94 16 94 30 C94 46 80 64 50 88 Z",
  };
  let inner;
  if (shape === "circle") inner = `<circle cx="50" cy="50" r="42" fill="${color}" stroke="#fff" stroke-width="6"/>`;
  else if (shape === "square") inner = `<rect x="10" y="10" width="80" height="80" rx="18" fill="${color}" stroke="#fff" stroke-width="6"/>`;
  else inner = `<path d="${paths[shape]}" fill="${color}" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${inner}</svg>`;
}

// ===== 파우치 전환 =====
const folderNameEl = document.getElementById("folderName");

function clearPhotoStickers() {
  for (let i = bodies.length - 1; i >= 0; i--) {
    const it = bodies[i];
    if (it.storeIdx !== null) {
      Composite.remove(engine.world, it.body);
      it.el.remove();
      bodies.splice(i, 1);
    }
  }
}

function switchFolder(id) {
  db.current = id;
  saveDB();
  clearPhotoStickers();
  currentFolder().stickers.forEach((item, i) => spawnPhotoSticker(item, false, i));
  folderNameEl.textContent = currentFolder().name;
  if (mode === "grid") enterGrid();

function openFolderEdit(id) {

  if (db.current === editingId) switchFolder(db.folders[0].id);

});
